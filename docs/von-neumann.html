<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arquitectura de Von Neumann</title>
<style>
  :root{
    --indigo: #3f51b5;
    --indigo-dark: #303f9f;
    --amber: #ffa000;
    --paper: #f7f8fc;
    --ink: #22273a;
    --line: #c9cee0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 32px;
  }
  h2{
    text-align:center;
    margin: 0 0 4px;
    font-weight: 700;
    color: var(--indigo-dark);
    letter-spacing: -0.01em;
  }
  p.sub{
    text-align:center;
    margin: 0 0 20px;
    color: #5b6178;
    font-size: 0.95em;
  }
  .stage{
    max-width: 760px;
    margin: 0 auto;
    position: relative;
  }
  svg{ width:100%; height:auto; display:block; }

  .block{
    fill: white;
    stroke: var(--line);
    stroke-width: 2;
    rx: 12;
    transition: stroke 0.25s, fill 0.25s;
  }
  .block.active{
    stroke: var(--indigo);
    fill: #eef0fb;
  }
  .label{
    font-size: 15px;
    font-weight: 700;
    fill: var(--indigo-dark);
  }
  .sublabel{
    font-size: 11.5px;
    fill: #5b6178;
  }
  .bus{
    fill: #e3e6f3;
    stroke: var(--line);
    stroke-width: 1.5;
  }
  .bus-label{
    font-size: 11px;
    fill: #7a80a0;
    font-style: italic;
  }
  .pulse{
    r: 6;
    fill: var(--amber);
    opacity: 0;
  }
  .pulse.go{
    animation: travel 0.9s ease-in-out forwards;
  }
  @keyframes travel{
    0%{ opacity: 1; }
    90%{ opacity: 1; }
    100%{ opacity: 0; }
  }

  .controls{
    max-width: 760px;
    margin: 20px auto 0;
    display:flex;
    gap: 10px;
    justify-content:center;
    flex-wrap: wrap;
  }
  button{
    font-family: inherit;
    font-size: 0.9em;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: var(--indigo);
    color: white;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover{ background: var(--indigo-dark); }
  button:active{ transform: scale(0.97); }
  button.secondary{
    background: white;
    color: var(--indigo-dark);
    border: 1.5px solid var(--line);
  }
  button.secondary:hover{ background: #eef0fb; }
  button:disabled{
    opacity: 0.4;
    cursor: default;
  }

  .status{
    max-width: 760px;
    margin: 16px auto 0;
    padding: 12px 16px;
    background: white;
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--indigo);
    border-radius: 8px;
    font-size: 0.92em;
    min-height: 1.3em;
  }
  .status b{ color: var(--indigo-dark); }
</style>
</head>
<body>

<h2>Arquitectura de Von Neumann</h2>
<p class="sub">Haz clic en «Siguiente paso» para ver cómo viaja una instrucción por el ordenador</p>

<div class="stage">
  <svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">

    <!-- Bus lines -->
    <line id="bus-mem-cpu" x1="230" y1="170" x2="330" y2="170" stroke="#c9cee0" stroke-width="10" stroke-linecap="round"/>
    <line id="bus-cpu-io"  x1="470" y1="170" x2="560" y2="170" stroke="#c9cee0" stroke-width="10" stroke-linecap="round"/>
    <text x="280" y="160" class="bus-label" text-anchor="middle">bus interno</text>
    <text x="515" y="160" class="bus-label" text-anchor="middle">bus externo</text>

    <!-- Memoria -->
    <rect id="mem" class="block" x="40" y="110" width="190" height="120"/>
    <text x="135" y="145" class="label" text-anchor="middle">Memoria principal</text>
    <text x="135" y="165" class="sublabel" text-anchor="middle">Instrucciones y datos</text>
    <text x="135" y="182" class="sublabel" text-anchor="middle">MAR · MDR · Decodificador</text>

    <!-- CPU -->
    <rect id="cpu" class="block" x="330" y="60" width="140" height="220"/>
    <text x="400" y="90" class="label" text-anchor="middle">CPU</text>

    <rect id="uc" class="block" x="345" y="105" width="110" height="45"/>
    <text x="400" y="132" class="sublabel" text-anchor="middle" font-weight="700">Unidad de control</text>

    <rect id="alu" class="block" x="345" y="160" width="110" height="45"/>
    <text x="400" y="187" class="sublabel" text-anchor="middle" font-weight="700">ALU</text>

    <rect id="reg" class="block" x="345" y="215" width="110" height="45"/>
    <text x="400" y="242" class="sublabel" text-anchor="middle" font-weight="700">Registros</text>

    <!-- E/S -->
    <rect id="io" class="block" x="560" y="110" width="100" height="120"/>
    <text x="610" y="145" class="label" text-anchor="middle">E / S</text>
    <text x="610" y="165" class="sublabel" text-anchor="middle">Teclado,</text>
    <text x="610" y="180" class="sublabel" text-anchor="middle">pantalla...</text>

    <!-- pulse dots -->
    <circle id="pulse1" class="pulse" cx="230" cy="170"/>
    <circle id="pulse2" class="pulse" cx="470" cy="170"/>
  </svg>
</div>

<div class="status" id="status">Pulsa <b>Siguiente paso</b> para empezar el ciclo de ejecución.</div>

<div class="controls">
  <button id="nextBtn" onclick="nextStep()">Siguiente paso ▶</button>
  <button class="secondary" onclick="reset()">Reiniciar ⟲</button>
</div>

<script>
const steps = [
  {
    blocks: ['mem'],
    text: 'La <b>unidad de control</b> pide la próxima instrucción a la <b>memoria principal</b>, usando la dirección guardada en el contador de programa.'
  },
  {
    blocks: ['mem','uc'],
    bus: 'bus-mem-cpu', pulse: 'pulse1',
    text: 'La instrucción viaja por el <b>bus interno</b> desde la memoria hasta el <b>registro de instrucción</b> de la CPU.'
  },
  {
    blocks: ['uc'],
    text: 'El <b>decodificador de instrucciones</b> interpreta qué operación hay que hacer y activa las señales de control necesarias.'
  },
  {
    blocks: ['alu','reg'],
    text: 'La <b>ALU</b> ejecuta la operación (una suma, una comparación...) usando los datos que están en los <b>registros</b>.'
  },
  {
    blocks: ['alu','uc','io'],
    bus: 'bus-cpu-io', pulse: 'pulse2',
    text: 'Si la instrucción lo requiere, el resultado se envía por el <b>bus externo</b> hacia un periférico de <b>entrada/salida</b> (por ejemplo, mostrarlo en pantalla).'
  },
  {
    blocks: [],
    text: '✅ Ciclo completado: <b>Buscar → Decodificar → Ejecutar → Almacenar</b>. La unidad de control vuelve a pedir la siguiente instrucción y el ciclo se repite.'
  }
];

let current = -1;
const allBlocks = ['mem','cpu','uc','alu','reg','io'];

function clearActive(){
  allBlocks.forEach(id => document.getElementById(id).classList.remove('active'));
}

function nextStep(){
  current++;
  if(current >= steps.length){
    reset();
    return;
  }
  clearActive();
  const step = steps[current];
  step.blocks.forEach(id => document.getElementById(id).classList.add('active'));
  document.getElementById('status').innerHTML = step.text;

  if(step.pulse){
    const p = document.getElementById(step.pulse);
    p.classList.remove('go');
    void p.offsetWidth; // reinicia animación
    p.classList.add('go');
  }

  if(current === steps.length - 1){
    document.getElementById('nextBtn').innerText = 'Empezar de nuevo ↺';
  }
}

function reset(){
  current = -1;
  clearActive();
  document.getElementById('status').innerHTML = 'Pulsa <b>Siguiente paso</b> para empezar el ciclo de ejecución.';
  document.getElementById('nextBtn').innerText = 'Siguiente paso ▶';
}
</script>

</body>
</html>
